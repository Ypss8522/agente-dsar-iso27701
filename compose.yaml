services:
  backend:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    env_file: backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////app/backend/instance/dsar.db
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/dsar-request
      EMBEDDING_MODEL: /app/models_local/embeddings
    volumes:
      - dsar_db:/app/backend/instance
      - ./models_local:/app/models_local:ro
      - ./ai_engine/data:/app/ai_engine/data:ro
    restart: unless-stopped
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.7
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      GENERIC_TIMEZONE: America/Lima
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
volumes:
  dsar_db:
  n8n_data:
